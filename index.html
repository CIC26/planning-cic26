<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planning CIC</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#fff;--ink:#121821;--mut:#5b6574;--line:#d9dee6;--off:#e4e7ec;--we:#fff4d6;--blue:#2c5aa0;--teal:#3f8a80;--red:#d6312b;--amber:#d98a00;--panel:#f3f6fa;--cg:#d8e5fb;--cgi:#173e7a;--md:#fbdde3;--mdi:#8a1c34;--fo:#e8defa;--foi:#4b2a86;--pr:#d5f0e3;--pri:#0f5e3d;--am:#e9eaec;--ami:#3d4450}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--blue);color:#fff;padding:10px 14px 0}
.hrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}
.camp{display:flex;align-items:center;gap:6px;font-weight:600}
.camp button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:6px;min-width:34px;min-height:34px;font-size:16px;cursor:pointer}
.kpis{display:flex;flex-wrap:wrap;gap:6px}
.kpi{background:rgba(255,255,255,.13);border-radius:7px;padding:4px 10px;font-size:12px;white-space:nowrap}
.kpi b{font-size:16px;margin-right:4px}
.kpi.bad b{color:#ffd0cc}
.tabs{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;color:#fff;font:600 14px inherit;font-family:inherit;padding:9px 12px;border-radius:7px 7px 0 0;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.pills{display:flex;gap:4px;overflow-x:auto}
#monPills{flex:1 1 300px}
.pills button{flex:none}
.pills button,.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 13px inherit;font-family:inherit;padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:34px}
.pills button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.warn{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn:disabled{opacity:.5;cursor:default}
main{padding:10px 14px 30px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.g{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content}
.g th,.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;height:28px;width:33px;min-width:33px}
.g th.nm{position:sticky;left:0;z-index:2;background:var(--bg);text-align:left;padding:0 8px;width:110px;min-width:110px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g thead th{background:var(--panel);font-weight:600}
.g .dh{line-height:1.05;font-size:10.5px;color:var(--mut)}
.g .dh b{display:block;font-size:12.5px;color:var(--ink)}
.g .we{background:var(--we)}
.g thead th.we{background:var(--we)}
.g .fe b{color:#fff;background:var(--red);border-radius:4px;margin:0 3px}
.g tr.zr th,.g tr.zr td{height:12px;font-size:10px;line-height:11px}
.g tr.zr td.on.zA{background:#e07a2e}
.g tr.zr td.on.zB{background:#3f9e5a}
.g tr.zr td.on.zC{background:#7b5cc4}
.g tr.gh th{background:var(--panel);text-align:left;padding:5px 8px;font-size:13px;position:sticky;left:0}
.g tr.gh span{color:var(--mut);font-weight:400;margin-left:8px}
.g td.c{cursor:pointer;position:relative}
.g td.c:hover{outline:2px solid var(--blue);outline-offset:-2px}
.g td.ro{cursor:default}
.g td.ro:hover{outline:0}
.g td.off{background:repeating-linear-gradient(135deg,var(--off) 0 4px,transparent 4px 7px)}
.g td.off.we{background:repeating-linear-gradient(135deg,var(--off) 0 4px,var(--we) 4px 7px)}
.g td.na{background:#c9ced6}
.chip{display:inline-block;border-radius:4px;padding:1px 2px;font-weight:700;font-size:10px;line-height:1.3;max-width:31px;overflow:hidden;white-space:nowrap}
.k-cg{background:var(--cg);color:var(--cgi)}.k-md{background:var(--md);color:var(--mdi)}.k-fo{background:var(--fo);color:var(--foi)}.k-pr{background:var(--pr);color:var(--pri)}.k-am{background:var(--am);color:var(--ami)}
.hh{display:block;font-size:9px;color:var(--mut);line-height:1}
.dot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.okm{position:absolute;bottom:0;right:2px;font-size:9px;color:var(--teal);font-weight:800}
.pend{position:absolute;bottom:2px;right:2px;width:5px;height:5px;border-radius:50%;border:1.5px solid var(--red)}
.bad-off{box-shadow:inset 0 0 0 2px var(--amber)}
.g tr.cnt th{font-weight:400;color:var(--mut);font-size:12px}
.g tr.cnt td{font-weight:800}
.g tr.cnt td.ok{color:var(--teal)}.g tr.cnt td.lim{color:var(--amber)}.g tr.cnt td.ko{background:var(--red);color:#fff}
.g tr.res th{color:var(--mut)}
.lay{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:1150px){.lay.sup{grid-template-columns:minmax(0,1fr) 260px}}
.side{background:var(--panel);border-radius:8px;padding:12px 14px;align-self:start}
.side h3{margin:0 0 6px;font-size:15px}
.side ul{margin:0 0 12px;padding-left:18px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--mut);align-items:center}
.legend i{display:inline-block;width:16px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.note{font-size:12.5px;color:var(--mut)}
.year{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;align-items:center}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);height:30px;border-radius:4px;overflow:hidden;background:var(--panel)}
.strip i.w{background:#9cc8c1}.strip i.l{background:var(--amber)}.strip i.k{background:var(--red)}.strip i.f{background:var(--off)}
.strip i{border-right:1px solid #fff}
.mlab{display:grid;font-size:11px}
.mlab button{border:0;border-left:1px solid var(--line);background:none;color:var(--mut);font:600 11px inherit;font-family:inherit;cursor:pointer;text-align:left;padding:3px 0 3px 4px}
.ov{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:20;overflow:auto}
.ov.on{display:flex}
.dlg{background:var(--bg);border-radius:12px;max-width:560px;width:100%;padding:16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h2{margin:0;font-size:19px}
.dlg .sub{color:var(--mut);margin:2px 0 10px}
.cg h4{margin:8px 0 4px;font-size:12px;color:var(--mut);font-weight:600}
.cg div{display:flex;flex-wrap:wrap;gap:4px}
.cb{border:2px solid transparent;border-radius:6px;padding:4px 7px;font:700 12.5px inherit;font-family:inherit;cursor:pointer;min-height:32px}
.cb[aria-pressed=true]{border-color:var(--ink)}
.fld{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fld label{font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:3px;flex:1 1 140px}
.fld input,.fld select{font:15px inherit;font-family:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;margin-top:10px}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.warnbox{background:#fff3db;border:1px solid #f0c674;border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;z-index:30;display:none;max-width:90vw}
.toast.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0;font-size:14px}
.card .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.card .big.neg{color:var(--red)}
.card table{width:100%;font-size:12.5px;border-collapse:collapse}
.card td{padding:2px 0;border-top:1px solid var(--panel)}
.card td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.al{background:#fdecea;border-left:4px solid var(--red);padding:8px 12px;border-radius:6px;margin:8px 0}
.hidden{display:none!important}
.adm section{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.adm h3{margin:0 0 6px;font-size:15px}
.adm li{margin:2px 0}
#printArea{display:none}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
 #printArea h2{font-size:14px;margin:6px 0}
 #printArea .blk{break-inside:avoid;margin-bottom:8px}
 .g th,.g td{height:16px;width:22px;min-width:22px;font-size:8px}
 .g th.nm{width:70px;min-width:70px;font-size:9px;position:static}
 .chip{font-size:7px;max-width:21px}
 .hh,.dot,.okm,.pend{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="hrow">
    <h1>Planning CIC</h1>
    <div class="camp"><button id="cPrev" aria-label="Campagne précédente">‹</button><span id="cLab"></span><button id="cNext" aria-label="Campagne suivante">›</button></div>
    <div class="kpis" id="kpis"></div>
  </div>
  <nav class="tabs">
    <button id="t-saisie" aria-selected="true">Saisie par groupe</button>
    <button id="t-sup" aria-selected="false">Vue superviseur</button>
    <button id="t-an" aria-selected="false">Vue annuelle</button>
    <button id="t-cpt" aria-selected="false">Mon compteur</button>
    <button id="t-adm" aria-selected="false">Administration</button>
  </nav>
</header>
<div class="bar" id="bar">
  <div class="pills" id="grpPills"></div>
  <div class="pills" id="monPills"></div>
  <select id="printSel" class="btn" aria-label="Que faut-il imprimer ?">
    <option value="m">Imprimer le mois affiché</option>
    <option value="yg">Imprimer l'année du groupe</option>
    <option value="ya">Imprimer l'année du service</option>
  </select>
  <button class="btn" id="printBtn">Imprimer</button>
  <button class="btn" id="refresh">Actualiser</button>
</div>
<main><div id="view"><p class="note">Chargement…</p></div>
  <div class="legend" id="legend">
    <span><i style="background:repeating-linear-gradient(135deg,var(--off) 0 4px,transparent 4px 7px);border:1px solid var(--line)"></i>Repos du cycle</span>
    <span><i style="background:var(--we);border:1px solid var(--line)"></i>Samedi, dimanche, férié</span>
    <span><i style="background:var(--red)"></i>Numéro d'un jour férié</span>
    <span><i style="background:#e07a2e"></i>Zone A</span><span><i style="background:#3f9e5a"></i>Zone B</span><span><i style="background:#7b5cc4"></i>Zone C</span>
    <span><i class="k-cg"></i>Congés, repos</span><span><i class="k-md"></i>Maladie, famille</span><span><i class="k-fo"></i>Stage, convocation</span><span><i class="k-pr"></i>Présence</span><span><i class="k-am"></i>Temps partiel</span>
    <span><b style="color:var(--teal)">✓</b> confirmé dans le logiciel officiel</span><span><i style="background:#c9ced6"></i>Hors affectation</span>
  </div>
</main>
<div id="printArea"></div>
<div class="toast" id="toast" role="status"></div>

<div class="ov" id="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dT">
  <h2 id="dT"></h2><p class="sub" id="dS"></p>
  <div id="dCodes"></div>
  <div class="fld">
    <label id="lSens" class="hidden">Heures supplémentaires<select id="fSens"><option value="Acquis">Acquises : je travaille, je note le total acquis</option><option value="Consommé">Consommées : je pose des heures</option></select></label>
    <label id="lH" class="hidden">Durée (vide = vacation entière)<input id="fH" type="text" inputmode="numeric" placeholder="ex. 4:00" maxlength="6"></label>
    <label id="lDA" class="hidden">Heures prises sur<select id="fDA"><option value="HS">HS</option><option value="RTT">RTT</option><option value="RPS">RPS</option><option value="CF">CF</option></select></label>
    <label id="lG" class="hidden">Groupe renforcé<select id="fG"></select></label>
    <label id="lN" class="hidden">Nom du réserviste<input id="fN" type="text" maxlength="24"></label>
    <label id="lFin">Jusqu'au (inclus, jours travaillés seulement)<input id="fFin" type="date"></label>
    <label style="flex-basis:100%">Commentaire (tir, visite médicale…)<input id="fC" type="text" maxlength="80"></label>
  </div>
  <label class="chk" id="lOk"><input type="checkbox" id="fOk">Confirmé dans le logiciel officiel</label>
  <div id="dWarn" class="warnbox hidden"></div>
  <div class="acts"><button class="btn" id="dDel">Effacer</button><button class="btn" id="dX">Fermer</button><button class="btn pri" id="dSave">Enregistrer</button></div>
</div></div>

<script>
{
/* ---------- Constantes ---------- */
const DAY=864e5, PAT='11000110011100';
const MN=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const AB=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const WD=['D','L','M','M','J','V','S'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=t=>new Date(t).toISOString().slice(0,10);
const dow=t=>new Date(t).getUTCDay();
const sec2iso=s=>s?iso(s*1000):null;
const iso2sec=d=>Date.parse(d)/1000;
const h2s=h=>{const neg=h<0;const m=Math.round(Math.abs(h)*60);return (neg?'−':'')+Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')};
const s2h=s=>{s=String(s||'').trim().replace('h',':');if(!s)return 0;const p=s.split(':');const v=(+p[0]||0)+((+p[1]||0)/60);return isFinite(v)?v:0};
const fmtD=d=>{const t=Date.parse(d);return ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'][dow(t)]+' '+new Date(t).getUTCDate()+' '+MN[new Date(t).getUTCMonth()]+' '+new Date(t).getUTCFullYear()};
const toast=(m,ms=4000)=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms)};

/* ---------- Schéma Grist (utilisé par l'installation) ---------- */
const F_GROUPE_AGENT="import datetime\nt = TODAY()\naffs = sorted(Affectations.lookupRecords(Agent=$id), key=lambda a: a.Debut or datetime.date(1900, 1, 1))\ng = \"\"\nfor a in affs:\n  if a.Debut and a.Debut <= t and (not a.Fin or t <= a.Fin):\n    g = a.Groupe.Code\nif not g:\n  futur = [a for a in affs if a.Debut and a.Debut > t]\n  if futur:\n    g = futur[0].Groupe.Code\nreturn g\n";
const F_CALC="import json, datetime\ny = $Annee\nif not $Agent or not y:\n  return \"\"\nD0, D1 = datetime.date(y, 1, 1), datetime.date(y, 12, 31)\ntoday = TODAY()\nPAT = \"11000110011100\"\nhebdo = ($Regime == \"Hebdo\")\nDMJ = (7 + 53 / 60.0) if hebdo else (12 + 8 / 60.0)\nEPS = 1e-6\nC = dict((c.Code, c) for c in Codes.lookupRecords())\nG = dict((g.Code, g) for g in Groupes.lookupRecords())\nfer = set(f.Date for f in Feries.lookupRecords() if f.Date)\naffs = sorted(Affectations.lookupRecords(Agent=$Agent.id), key=lambda a: a.Debut or datetime.date(1900, 1, 1))\nS = {}\nfor s in Saisies.lookupRecords(Agent=$Agent.id):\n  if s.Date and D0 <= s.Date <= D1:\n    S[s.Date] = s\n\ndef grp(d):\n  g = None\n  for a in affs:\n    if a.Debut and a.Debut <= d and (not a.Fin or d <= a.Fin):\n      g = a.Groupe\n  return g\n\ndef works(g, d):\n  if not g:\n    return False\n  if g.Type == \"Hebdo\":\n    return d.weekday() < 5 and d not in fer\n  if not g.Ancre:\n    return False\n  return PAT[(d - g.Ancre).days % 14] == \"1\"\n\ndef hm(t, dflt):\n  try:\n    h, m = str(t).split(\":\")\n    return int(h) + int(m) / 60.0\n  except Exception:\n    return dflt\n\ndef rps(day, g):\n  # 0,4 par heure travaill\u00e9e le dimanche ; 0,1 par heure travaill\u00e9e entre 21 h et 6 h (non cumulables)\n  if not g or g.Type == \"Hebdo\":\n    return 0.0\n  start = datetime.datetime.combine(day, datetime.time()) + datetime.timedelta(hours=hm(g.Prise_service, 7.0))\n  end = start + datetime.timedelta(hours=12 + 8 / 60.0)\n  pts = set([start, end])\n  d = day\n  while datetime.datetime.combine(d, datetime.time()) <= end:\n    for h in (0, 6, 21):\n      p = datetime.datetime.combine(d, datetime.time(h))\n      if start < p < end:\n        pts.add(p)\n    d += datetime.timedelta(days=1)\n  pts = sorted(pts)\n  tot = 0.0\n  for a, b in zip(pts, pts[1:]):\n    mid = a + (b - a) / 2\n    c = 0.4 if mid.weekday() == 6 else (0.1 if (mid.hour >= 21 or mid.hour < 6) else 0.0)\n    tot += c * (b - a).total_seconds() / 3600.0\n  return tot\n\ndef absent(s):\n  c = C.get(s.Code)\n  if not c:\n    return False\n  if s.Code == \"HS\" and s.Sens == \"Acquis\":\n    return False\n  if c.Presence == \"Absent\":\n    return True\n  if c.Presence == \"Partiel\":\n    return (s.Heures or DMJ) >= DMJ - EPS\n  return False\n\nK = [\"CA\", \"HP\", \"RTT\", \"CF\", \"RPS\", \"HS\", \"CET\", \"NT\"]\npris = dict((k, 0.0) for k in K)\navenir = dict((k, 0.0) for k in K)\ncredit_passe = {\"RPS\": 0.0, \"HS\": 0.0}\ncredit_futur = {\"RPS\": 0.0, \"HS\": 0.0}\nca_hors_periode = 0\nca_avant_mai = 0\ncmo = []\nfor d in sorted(S):\n  s = S[d]\n  c = C.get(s.Code)\n  if not c:\n    continue\n  futur = d > today\n  if s.Code == \"HS\":\n    h = s.Heures or DMJ\n    if s.Sens == \"Acquis\":\n      (credit_futur if futur else credit_passe)[\"HS\"] += (s.Heures or 0)\n    else:\n      (avenir if futur else pris)[\"HS\"] += h\n    continue\n  if s.Code in (\"D-A\", \"P-R\"):\n    k = s.Compteur_DA or \"HS\"\n    if k in pris:\n      (avenir if futur else pris)[k] += (s.Heures or 0)\n    continue\n  if s.Code == \"CMO\":\n    cmo.append(d)\n  k = c.Compteur\n  if not k or k not in pris:\n    continue\n  amt = 1.0 if c.Unite == \"Vacation\" else (s.Heures or DMJ)\n  (avenir if futur else pris)[k] += amt\n  if s.Code == \"CA\":\n    if not (datetime.date(y, 5, 1) <= d <= datetime.date(y, 10, 31)):\n      ca_hors_periode += 1\n    if d < datetime.date(y, 5, 1):\n      ca_avant_mai += 1\n\n# RPS acquis sur les vacations r\u00e9ellement tenues (cycle uniquement)\nif not hebdo:\n  d = D0\n  while d <= D1:\n    s = S.get(d)\n    g = grp(d)\n    v = 0.0\n    if s and s.Code == \"RFR\" and not works(g, d):\n      v = rps(d, G.get(s.Groupe_renfort) or g)\n    elif works(g, d) and not (s and absent(s)):\n      v = rps(d, g)\n    if v:\n      (credit_futur if d > today else credit_passe)[\"RPS\"] += v\n    d += datetime.timedelta(days=1)\n\n# Bar\u00e8me selon r\u00e9gime et quotit\u00e9\nq = $Quotite or 100\nb = Bareme.lookupOne(Regime=$Regime, Quotite=q)\nf = 1.0\nif not (b and b.id):\n  b = Bareme.lookupOne(Regime=$Regime, Quotite=100)\n  f = q / 100.0\nif not (b and b.id):\n  b = None\n\n# R\u00e9duction du cr\u00e9dit f\u00e9ri\u00e9 : 1/24 par arr\u00eat maladie ordinaire de 15 jours cons\u00e9cutifs ou plus\nreduc = 0\nif cmo:\n  first = prev = cmo[0]\n  for d in cmo[1:] + [None]:\n    if d is not None and (d - prev).days <= 4:\n      prev = d\n      continue\n    if (prev - first).days + 1 >= 15:\n      reduc += 1\n    if d is not None:\n      first = prev = d\ncf_base = (b.CF * f) if b else 0.0\nnb_hp = 2 if ca_hors_periode >= 8 else (1 if ca_hors_periode >= 5 else 0)\ndroit = {\n  \"CA\": ((b.CA * f) if b else 0) + ($Report_CA or 0),\n  \"HP\": nb_hp,\n  \"RTT\": ((b.ARTT * f) if b else 0) + ($Report_RTT or 0),\n  \"CF\": cf_base - reduc * cf_base / 24.0 + ($Report_CF or 0),\n  \"RPS\": ($Report_RPS or 0),\n  \"HS\": ($Report_HS or 0),\n  \"CET\": ($Report_CET or 0),\n  \"NT\": ((b.NT * f) if b else 0),\n}\nLAB = {\"CA\": \"Cong\u00e9s annuels\", \"HP\": \"Jours de fractionnement\", \"RTT\": \"ARTT\", \"CF\": \"Cr\u00e9dit f\u00e9ri\u00e9\",\n       \"RPS\": \"Repos p\u00e9nibilit\u00e9 sp\u00e9cifique\", \"HS\": \"Heures suppl\u00e9mentaires\", \"CET\": \"CET\", \"NT\": \"Jours non travaill\u00e9s (temps partiel)\"}\nUNIT = {\"CA\": \"j\", \"HP\": \"j\", \"RTT\": \"h\", \"CF\": \"h\", \"RPS\": \"h\", \"HS\": \"h\", \"CET\": \"j\", \"NT\": \"j\"}\n\ndef fmt(v, u):\n  if u == \"j\":\n    return (\"%g\" % round(v, 1)) + \" j\"\n  sg = \"-\" if v < -EPS else \"\"\n  m = int(round(abs(v) * 60))\n  return \"%s%dh%02d\" % (sg, m // 60, m % 60)\n\nrows = []\nal = []\nfor k in K:\n  acq_passe = credit_passe.get(k, 0.0)\n  acq_futur = credit_futur.get(k, 0.0)\n  sd = droit[k] + acq_passe - pris[k]\n  sp = droit[k] + acq_passe + acq_futur - pris[k] - avenir[k]\n  if k == \"NT\" and droit[k] == 0 and pris[k] == 0 and avenir[k] == 0:\n    continue\n  rows.append({\"k\": k, \"lib\": LAB[k], \"u\": UNIT[k], \"droit\": droit[k], \"acquis\": acq_passe, \"a_acquerir\": acq_futur,\n               \"pris\": pris[k], \"avenir\": avenir[k], \"solde\": sd, \"projete\": sp})\n  if sp < -EPS and k != \"RTT\":\n    al.append(\"%s : solde projet\u00e9 au 31/12 n\u00e9gatif (%s)\" % (LAB[k], fmt(sp, UNIT[k])))\nif y == today.year and today.month >= 10:\n  cf = [r for r in rows if r[\"k\"] == \"CF\"]\n  if cf and cf[0][\"projete\"] > EPS:\n    al.append(\"Cr\u00e9dit f\u00e9ri\u00e9 : %s pas encore pos\u00e9es, non reportables apr\u00e8s le 31/12\" % fmt(cf[0][\"projete\"], \"h\"))\n  nt = [r for r in rows if r[\"k\"] == \"NT\"]\n  if nt and nt[0][\"projete\"] > EPS:\n    al.append(\"Temps partiel : %s non travaill\u00e9(s) restant \u00e0 placer\" % fmt(nt[0][\"projete\"], \"j\"))\nif ($Report_CA or 0) > 0 and ca_avant_mai < ($Report_CA or 0) and (y > today.year or (y == today.year and today < datetime.date(y, 5, 1))):\n  al.append(\"CA report\u00e9s : %s \u00e0 poser avant le 1er mai\" % fmt(($Report_CA or 0) - ca_avant_mai, \"j\"))\nif reduc:\n  al.append(\"Cr\u00e9dit f\u00e9ri\u00e9 r\u00e9duit de %d/24 (arr\u00eat maladie de 15 jours ou plus)\" % reduc)\nrtt = [r for r in rows if r[\"k\"] == \"RTT\"][0]\nreturn json.dumps({\"annee\": y, \"regime\": $Regime, \"dmj\": DMJ, \"rows\": rows, \"alertes\": al,\n                   \"cet_equiv_j\": max(rtt[\"projete\"], 0) / (8 + 21 / 60.0),\n                   \"ca_hors_periode\": ca_hors_periode, \"reduc_cf\": reduc})\n";

   try{await grist.docApi.applyUserActions([['AddRawTable',t,spec]])}catch(e){await grist.docApi.applyUserActions([['AddTable',t,spec]])}}

   await bulk('Affectations',['Agent','Groupe','Debut','Fin'],aff)}
  toast('Installation terminée. Pensez aux règles d\'accès (voir le guide).',7000);await load();
 }catch(e){console.error(e);toast('Erreur pendant l\'installation : '+(e.message||e),9000);btn.disabled=false;btn.textContent='Réessayer'}}

 const k=counterOf(vals);if(!k||k==='RTT')return [];const row=cp.j.rows.find(r=>r.k===k);if(!row)return [];
 let delta=0;dates.forEach(d=>{const old=D.S[cur.a.id+'|'+d];if(old&&counterOf(old)===k)delta-=amountOf(old,cur.gc);delta+=amountOf(vals,cur.gc)});
 const after=row.projete-delta;if(after<-1e-6)return [`${row.lib} : solde projeté au 31/12 après cette saisie ${row.u==='j'?(Math.round(after*10)/10)+' j':h2s(after)}.`];return []}
async function save(){if(!cur)return;const vals={Code:sel||''};const c=sel&&D.C[sel];
 vals.Heures=c&&c.Unite==='Heures'?s2h(document.getElementById('fH').value):0;
 vals.Sens=sel==='HS'?document.getElementById('fSens').value:null;vals.Compteur_DA=(sel==='D-A'||sel==='P-R')?document.getElementById('fDA').value:null;
 vals.Groupe_renfort=sel==='RFR'?document.getElementById('fG').value:'';vals.Nom_reserviste=cur.a.Statut==='Réserviste'?document.getElementById('fN').value.trim():'';
 vals.Commentaire=document.getElementById('fC').value.trim();if(admin)vals.Confirme=document.getElementById('fOk').checked;
 if(sel==='HS'&&vals.Sens==='Acquis'&&!vals.Heures)return toast('Indiquez le total d\'heures acquises.');
 if((sel==='D-A'||sel==='P-R')&&!vals.Heures)return toast('Indiquez la durée.');
 const dates=targetDates();
 if(!forceSave){const w=warnings(vals,dates);if(w.length){const box=document.getElementById('dWarn');box.innerHTML=w.map(esc).join('<br>')+'<br>La saisie reste possible.';box.classList.remove('hidden');forceSave=true;const b=document.getElementById('dSave');b.textContent='Enregistrer quand même';b.classList.add('warn');return}}
 if(!vals.Code&&!vals.Commentaire&&!vals.Nom_reserviste)return del();
 const acts=dates.map(d=>{const old=D.S[cur.a.id+'|'+d];const v={...vals};if(d!==cur.d&&old&&old.Commentaire&&!v.Commentaire)v.Commentaire=old.Commentaire;
  return old?['UpdateRecord','Saisies',old.id,v]:['AddRecord','Saisies',null,{...v,Agent:cur.a.id,Date:iso2sec(d),Groupe:cur.gc}]});
 try{await grist.docApi.applyUserActions(acts);close();toast(dates.length>1?dates.length+' jours enregistrés.':'Enregistré.');await load()}catch(e){console.error(e);toast('Modification refusée : vous ne pouvez modifier que votre groupe.')}}
async function del(){const old=D.S[cur.a.id+'|'+cur.d];if(!old){close();return}
 try{await grist.docApi.applyUserActions([['RemoveRecord','Saisies',old.id]]);close();toast('Case effacée.');await load()}catch(e){toast('Suppression refusée.')}}
function close(){document.getElementById('ov').classList.remove('on')}

/* ---------- Impression ---------- */
function doPrint(){const ms=months(),mode=document.getElementById('printSel').value,P=document.getElementById('printArea');let h='';
 const gs=mode==='yg'?[D.G[grp]]:allGroups();
 if(mode==='m'){const m=ms[mon];h=`<h2>Planning CIC · ${esc(m.full)}</h2>`+(tab==='saisie'?grid([D.G[grp]],m,false):grid(allGroups(),m,true))}
 else ms.forEach(m=>{if(m.days.length)h+=`<div class="blk"><h2>Planning CIC · ${esc(m.full)}${mode==='yg'?' · '+esc(D.G[grp].Nom):''}</h2>${grid(gs,m,false)}</div>`});
 P.innerHTML=h;try{window.print()}catch(e){toast('Impression bloquée par le navigateur : ouvrez le widget en plein écran puis réessayez.')}}

/* ---------- Événements ---------- */
document.addEventListener('click',ev=>{const b=ev.target.closest('button,td.c');if(!b)return;
 if(b.matches('td.c'))return openCell(+b.dataset.a,b.dataset.g,b.dataset.d);
 if(b.dataset.gp){grp=b.dataset.gp;render()}else if(b.dataset.m){mon=+b.dataset.m;render()}else if(b.dataset.jm){mon=+b.dataset.jm;tab='sup';render()}
 else if(b.dataset.c){sel=sel===b.dataset.c?null:b.dataset.c;fields()}
 else if(b.id&&b.id.startsWith('t-')){tab=b.id.slice(2);render()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close();if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('td.c')){ev.preventDefault();openCell(+ev.target.dataset.a,ev.target.dataset.g,ev.target.dataset.d)}});
document.getElementById('dX').onclick=close;document.getElementById('dDel').onclick=del;document.getElementById('dSave').onclick=save;
document.getElementById('ov').onclick=ev=>{if(ev.target.id==='ov')close()};
['fSens','fDA','fFin','fH'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{forceSave=false;document.getElementById('dWarn').classList.add('hidden');const b=document.getElementById('dSave');b.textContent='Enregistrer';b.classList.remove('warn')}));
document.getElementById('cPrev').onclick=()=>{camp=Math.max(2026,camp-1);mon=0;render()};document.getElementById('cNext').onclick=()=>{camp++;mon=0;render()};
document.getElementById('refresh').onclick=load;document.getElementById('printBtn').onclick=doPrint;

/* ---------- Démarrage ---------- */
if(!window.grist){document.getElementById('view').innerHTML='<p>Ce widget doit être ouvert dans un document Grist (widget personnalisé, accès complet au document).</p>'}
else{grist.ready({requiredAccess:'full'});let tm=null;grist.onRecords(()=>{clearTimeout(tm);tm=setTimeout(load,300)});load();setInterval(()=>{if(!document.getElementById('ov').classList.contains('on'))load()},120000)}
}
</script>
</body>
</html>
